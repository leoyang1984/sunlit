[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sunlit"
version = "0.1.0"
description = "Design-stage ground sunlight analysis for CityJSON massing models."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Leo Yang" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "cjio>=0.9.0",
  "matplotlib>=3.7.0",
  "numpy>=1.24.0",
  "pydantic>=2.0.0",
  "pvlib>=0.10.0",
  "rich>=13.0.0",
  "rtree>=1.0.0",
  "shapely>=2.0.0",
  "trimesh>=4.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.0.0",
  "pytest>=8.0.0",
  "twine>=6.0.0",
]

[project.scripts]
sunlit = "sunlit.cli:app"

[project.urls]
Homepage = "https://github.com/leoyang1984/sunlit"
Repository = "https://github.com/leoyang1984/sunlit"
Issues = "https://github.com/leoyang1984/sunlit/issues"
Changelog = "https://github.com/leoyang1984/sunlit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sunlit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
